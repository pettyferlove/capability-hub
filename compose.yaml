name: capability-hub
x-minio-image: &minio-image ${CAPABILITY_HUB_MINIO_IMAGE:?Set an approved storage image}
x-runtime: &runtime
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,nosuid,size=256m,mode=1777
  stop_grace_period: 75s
  logging:
    driver: local
    options:
      max-size: '10m'
      max-file: '5'
services:
  server:
    <<: *runtime
    image: ${CAPABILITY_HUB_IMAGE:?Set a versioned application image}
    environment:
      NODE_ENV: production
      CAPABILITY_HUB_HOST: 0.0.0.0
      PORT: 4100
      CAPABILITY_HUB_PUBLIC_URL: ${CAPABILITY_HUB_PUBLIC_URL:?Set the public HTTPS URL}
      CAPABILITY_HUB_INSTANCE_SECRET: ${CAPABILITY_HUB_INSTANCE_SECRET:?Set a 64-character hex secret}
      CAPABILITY_HUB_SETUP_TOKEN: ${CAPABILITY_HUB_SETUP_TOKEN:?Set a unique setup token}
      CAPABILITY_HUB_DATA_DIR: /app/data
      CAPABILITY_HUB_WORKER_CONCURRENCY: ${CAPABILITY_HUB_WORKER_CONCURRENCY:-5}
      CAPABILITY_HUB_DATABASE_DRIVER: postgresql
      CAPABILITY_HUB_DATABASE_URL: postgresql://capability_hub:${CAPABILITY_HUB_POSTGRES_PASSWORD:?Set a URL-safe database password}@postgres:5432/capability_hub
      CAPABILITY_HUB_DATABASE_POOL_SIZE: ${CAPABILITY_HUB_DATABASE_POOL_SIZE:-10}
      CAPABILITY_HUB_OBJECT_STORAGE_DRIVER: minio
      CAPABILITY_HUB_MINIO_ENDPOINT: http://minio:9000
      CAPABILITY_HUB_MINIO_ACCESS_KEY: ${CAPABILITY_HUB_MINIO_ACCESS_KEY:?Set a dedicated application access key}
      CAPABILITY_HUB_MINIO_SECRET_KEY: ${CAPABILITY_HUB_MINIO_SECRET_KEY:?Set a dedicated application secret key}
      CAPABILITY_HUB_MINIO_BUCKET: ${CAPABILITY_HUB_MINIO_BUCKET:-capability-hub}
      CAPABILITY_HUB_MINIO_REGION: us-east-1
      CAPABILITY_HUB_LOG_LEVEL: ${CAPABILITY_HUB_LOG_LEVEL:-info}
      CAPABILITY_HUB_GIT_HOSTS: ${CAPABILITY_HUB_GIT_HOSTS:-github.com,gitlab.com}
      CAPABILITY_HUB_PRIVATE_GIT_HOSTS: ${CAPABILITY_HUB_PRIVATE_GIT_HOSTS:-}
      CAPABILITY_HUB_LDAP_URL: ${CAPABILITY_HUB_LDAP_URL:-}
      CAPABILITY_HUB_LDAP_BASE_DN: ${CAPABILITY_HUB_LDAP_BASE_DN:-}
      CAPABILITY_HUB_LDAP_BIND_DN: ${CAPABILITY_HUB_LDAP_BIND_DN:-}
      CAPABILITY_HUB_LDAP_BIND_PASSWORD: ${CAPABILITY_HUB_LDAP_BIND_PASSWORD:-}
      CAPABILITY_HUB_LDAP_DEFAULT_ROLES: ${CAPABILITY_HUB_LDAP_DEFAULT_ROLES:-maintainer,reader}
    ports:
      - '${CAPABILITY_HUB_BIND_HOST:-127.0.0.1}:${CAPABILITY_HUB_PORT:-4100}:4100'
    volumes:
      - server-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', 'scripts/healthcheck.mjs']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  postgres:
    <<: *runtime
    image: ${CAPABILITY_HUB_POSTGRES_IMAGE:-postgres:17.11-trixie}
    # 上游入口负责创建并切换数据库用户。
    read_only: false
    cap_drop: []
    environment:
      POSTGRES_DB: capability_hub
      POSTGRES_USER: capability_hub
      POSTGRES_PASSWORD: ${CAPABILITY_HUB_POSTGRES_PASSWORD:?Set a URL-safe database password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U capability_hub -d capability_hub']
      interval: 5s
      timeout: 3s
      retries: 15
  minio-volume-init:
    image: busybox:1.37.0
    network_mode: none
    user: '0:0'
    restart: 'no'
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    entrypoint: ['chown', '1000:1000', '/data']
    volumes:
      - minio-data:/data
  minio:
    <<: *runtime
    image: *minio-image
    command: ['server', '/data', '--console-address', ':9001']
    user: '1000:1000'
    depends_on:
      minio-volume-init:
        condition: service_completed_successfully
    environment:
      MC_CONFIG_DIR: /tmp/mc
      MINIO_ROOT_USER: ${CAPABILITY_HUB_MINIO_ROOT_USER:?Set the storage administrator user}
      MINIO_ROOT_PASSWORD: ${CAPABILITY_HUB_MINIO_ROOT_PASSWORD:?Set the storage administrator password}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local', '--json']
      interval: 5s
      timeout: 3s
      retries: 15
  minio-bootstrap:
    profiles: [bootstrap]
    image: *minio-image
    user: '1000:1000'
    restart: 'no'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    entrypoint: ['/bin/sh', '/bootstrap/minio-bootstrap.sh']
    environment:
      MC_CONFIG_DIR: /tmp/mc
      MINIO_ROOT_USER: ${CAPABILITY_HUB_MINIO_ROOT_USER:?Set the storage administrator user}
      MINIO_ROOT_PASSWORD: ${CAPABILITY_HUB_MINIO_ROOT_PASSWORD:?Set the storage administrator password}
      CAPABILITY_HUB_MINIO_ACCESS_KEY: ${CAPABILITY_HUB_MINIO_ACCESS_KEY:?Set a dedicated application access key}
      CAPABILITY_HUB_MINIO_SECRET_KEY: ${CAPABILITY_HUB_MINIO_SECRET_KEY:?Set a dedicated application secret key}
      CAPABILITY_HUB_MINIO_BUCKET: ${CAPABILITY_HUB_MINIO_BUCKET:-capability-hub}
    volumes:
      - ./deploy/scripts/minio-bootstrap.sh:/bootstrap/minio-bootstrap.sh:ro
    depends_on:
      minio:
        condition: service_healthy
volumes:
  server-data:
  postgres-data:
  minio-data:

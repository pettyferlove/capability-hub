packages:
  - apps/*
  - packages/*

injectWorkspacePackages: true

# Vite 所需的原生构建步骤。
allowBuilds:
  esbuild: true
  unrs-resolver: true

syncInjectedDepsAfterScripts:
  - build

overrides:
  # Drizzle 的旧加载器与迁移工具使用同一条 esbuild 分支。
  '@esbuild-kit/core-utils>esbuild': '0.25.12'
  # TSDoc 0.5.4 固定的 utils 仍引入 minimatch 10。
  'eslint-plugin-tsdoc@0.5.4>@typescript-eslint/utils': '^8.74.0'

catalog:
  '@types/express': '^5.0.6'
  '@types/node': '^24.19.4'
  '@types/pg': '^8.15.5'
  '@types/react': '^19.3.3'
  '@types/react-dom': '^19.3.0'
  '@types/semver': '^7.7.1'
  'express': '^5.3.0'
  'minio': '^8.0.6'
  'pg': '^8.16.3'
  'react': '^19.3.1'
  'react-dom': '^19.3.1'
  'semver': '^7.8.6'
  'tsx': '^4.20.6'
  'typescript': '^5.9.3'
  'zod': '4.6.7'
  '@mastra/core': '1.86.0'
  '@mastra/memory': '1.41.3'
  '@ai-sdk/openai-compatible': '3.0.95'
  '@ai-sdk/anthropic': '4.0.109'
  '@modelcontextprotocol/client': '2.4.0'
  '@modelcontextprotocol/server': '2.4.0'
  '@modelcontextprotocol/node': '2.1.2'
  'ai': '7.0.182'

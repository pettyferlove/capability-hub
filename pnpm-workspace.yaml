  'minio': '^8.0.6'
  'pg': '^8.16.3'
  'react': '^19.3.1'
  'react-dom': '^19.3.1'
  'semver': '^7.7.3'
  'tsx': '^4.20.6'
  'typescript': '^5.9.3'
  'zod': '^4.1.12'

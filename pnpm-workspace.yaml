packages:
  - apps/*
  - packages/*

injectWorkspacePackages: true

# Vite 所需的原生构建步骤。
onlyBuiltDependencies:
  - esbuild
  - unrs-resolver

syncInjectedDepsAfterScripts:
  - build

catalog:
  '@types/express': '^5.0.6'
  '@types/node': '^24.10.0'
  '@types/pg': '^8.15.5'
  '@types/react': '^19.3.0'
  '@types/react-dom': '^19.3.0'
  '@types/semver': '^7.7.1'
  'express': '^5.3.0'
  'minio': '^8.0.6'
  'pg': '^8.16.3'
  'react': '^19.3.1'
  'react-dom': '^19.3.1'
  'semver': '^7.7.3'
  'tsx': '^4.20.6'
  'typescript': '^5.9.3'
  'zod': '4.6.7'
  '@mastra/core': '1.81.0'
  '@mastra/memory': '1.40.0'
  '@ai-sdk/openai-compatible': '3.0.82'
  '@ai-sdk/anthropic': '4.0.94'
  '@modelcontextprotocol/client': '2.4.0'
  '@modelcontextprotocol/server': '2.4.0'
  '@modelcontextprotocol/node': '2.1.2'
  'ai': '7.0.159'

allowBuilds:
  esbuild: set this to true or false

include /etc/ldap/schema/core.schema
include /etc/ldap/schema/cosine.schema
include /etc/ldap/schema/inetorgperson.schema
pidfile /tmp/slapd.pid
argsfile /tmp/slapd.args
modulepath /usr/lib/ldap
moduleload back_mdb
database mdb
suffix "dc=hub,dc=test"
directory /fixture/data
access to attrs=userPassword by anonymous auth by * none
access to * by dn.exact="cn=hub-reader,dc=hub,dc=test" read by self read by * none
